{{- if eq .Type "alert" -}}
  {{- $labels := dict
    "note" "说明"
    "tip" "提示"
    "important" "重要"
    "warning" "注意"
    "caution" "谨慎"
  -}}
  {{- $title := or .AlertTitle (index $labels .AlertType) (title .AlertType) -}}
<aside class="notice notice-{{ .AlertType }}" aria-label="{{ $title }}">
  <p class="notice-title">{{ $title }}</p>
  {{ .Text }}
</aside>
{{- else -}}
<blockquote>
  {{ .Text }}
</blockquote>
{{- end -}}
